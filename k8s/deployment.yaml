apiVersion: apps/v1
kind: Deployment
metadata:
  name: gong-mcp
  labels:
    app: gong-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gong-mcp
  template:
    metadata:
      labels:
        app: gong-mcp
    spec:
      containers:
        - name: gong-mcp
          image: ${OKTETO_BUILD_GONG_MCP_IMAGE}
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: gong-mcp-secrets
          env:
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
